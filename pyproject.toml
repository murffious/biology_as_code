[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biology-as-code"
version = "0.1.0"
description = "Open digestion + teaching metabolic pathway graphs (Biology as Code companion)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-SAMPLES.md"]
requires-python = ">=3.11"
authors = [
  { name = "Paul Murff", email = "paulmorf@morfengineering.tech" },
]
maintainers = [
  { name = "Paul Murff", email = "paulmorf@morfengineering.tech" },
]
keywords = [
  "nutrition",
  "digestion",
  "metabolism",
  "pathways",
  "kibo",
  "biology-as-code",
  "meal",
  "simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
  "build>=1.0",
  "twine>=5.0",
  # Nutrient nodes and the absorption seed are YAML. Kept out of `dependencies`
  # so the core package stays zero-dependency; the loaders raise a directed
  # ImportError when it is missing rather than degrading silently.
  "pyyaml>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/murffious/biology_as_code"
Repository = "https://github.com/murffious/biology_as_code"
Issues = "https://github.com/murffious/biology_as_code/issues"
Documentation = "https://github.com/murffious/biology_as_code#readme"
Changelog = "https://github.com/murffious/biology_as_code/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
biology_as_code = [
  "py.typed",
  "data/*.json",
  "data/fixtures/*.json",
  "data/fixtures/**/*.json",
  "data/kibo_core/data/**/*",
  "nodes/data/*.yaml",
  "product_score/**/*.md",
  "machines/data/**/*.json",
  "machines/**/*.md",
  "data/systems/*.json",
  "data/systems/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "tests/_legacy_test_pathways_source.py",
  "**/__pycache__",
]

[tool.ruff.lint]
# Practical gate for legacy teaching codebase: bugs + imports, not full style rewrite
select = ["F", "I", "E9", "B006"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E402", "F401", "F841"]
