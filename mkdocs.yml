site_name: Biology as Code
site_description: Standardizing Nutrition Science for Preventive Medicine — companion site
site_url: https://murffious.github.io/biology_as_code/
repo_url: https://github.com/murffious/biology_as_code
repo_name: murffious/biology_as_code
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Renders the pathway .mermaid graphs inline rather than as code blocks.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Intro video: intro-video.md
  - Constitution: constitution.md
  - Note on the title: naming.md
  - "The book (coming soon)": book.md
  - "Nutrition map (interactive)": https://murffious.github.io/biology_as_code/nutrition-map/
  - "Primer: genome-scale metabolic models": gem-primer.md
  - "David & Nielsen 2005 (source map)": david-nielsen-2005.md
  - "Urea cycle (Recon3D reaction map)": figures/urea-cycle.md
  - Digestion engine: digestion.md
  - Digestion process (A-Z stages): digestion-process.md
  - Events & feedback: events.md
  - System coverage layer: systems-coverage.md
  - Notational conventions: notational-conventions.md
  - "The seven systems: vocabulary provenance": SYSTEMS-VOCABULARY-PROVENANCE.md
  - Metabolic constants (what may be encoded): metabolic-constants.md
  - Non-laws (looks like a law, is not): non-laws.md
  - Validation report: VALIDATION.md
  - Validation ledger: VALIDATION_LEDGER.md
  - Contributing data: contributing-data.md
  - Iron absorption weights (FDP-1 demo): iron/fractional-absorption.md
  - Related projects: related-projects.md
  - Awesome Internet of the Body: awesome-internet-of-the-body.md
  - Cookbook:
      - Overview: cookbook/index.md
      - 1. Gate vs Bound (iron): cookbook/01-gate-vs-bound.md
      - 2. The fat-vehicle gate: cookbook/02-fat-vehicle-gate.md
      - 3. Matrix effect (almond): cookbook/03-matrix-effect.md
      - 4. Auditing a real claim: cookbook/04-claim-audit.md
      - 5. Vitamin D vehicle: cookbook/05-vitamin-d-vehicle.md
  - Architecture:
      - Package: python/PACKAGE_ARCHITECTURE.md
      - Publishing: python/PUBLISHING.md
      - Add a pathway (template): python/ADD_PATHWAY.md
      - Pathway PR checklist: python/templates/NEW_PATHWAY_CHECKLIST.md
      - Pathway types refactor (done): python/PATHWAY_TYPES_REFACTOR.md
      - Nutrition ontology spec (v0.1): nutrition_ontology_spec.md

# Built and reachable by URL and search, but deliberately not in the nav: a
# working draft of a licence enquiry, with correspondence details, not a page
# for readers of the docs.
not_in_nav: |
  VMH-LICENCE-ENQUIRY.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/murffious/biology_as_code
  generator: false

copyright: Apache-2.0 licensed. FLOW teaching / research software — not medical advice.
