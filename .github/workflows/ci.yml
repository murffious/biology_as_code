name: CI

on:
  push:
    branches: [main, dev]
  # `dev` is here for a specific reason. Ten pull requests once sat open with no
  # checks at all because they targeted feature branches while this list said
  # [main, master] — the failures were invisible in the UI and only turned up when
  # the jobs were run locally against each branch. An integration branch that CI
  # does not watch reproduces that at scale, so any branch used as a merge target
  # must appear here.
  pull_request:
    branches: [main, dev]

jobs:
  separation:
    name: Separation gate (no product identifiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Rule E. The separation gate keeps product IP out; this keeps PEOPLE out.
      # Both are unrecoverable once pushed, so both run before anything expensive.
      - name: No human rows in a public repository
        run: python tools/check_no_human_rows.py
      - name: Third-party data accounted for
        # Every sizeable tracked data file must be declared in THIRD-PARTY-DATA.json.
        # (check_curies is deliberately NOT here: --offline needs the machine-local
        # cache, and an unrun check is not a pass.)
        run: python tools/check_third_party.py --strict
      - name: Separation gate (no product identifiers)
        # Replaced the inline grep 2026-08-30. That version scanned an explicit
        # directory list, so ontology-sdk/ accumulated ten references while CI stayed
        # green; it matched contents but never PATH names; and it conflated the product
        # name with the author name, which forced the files that reserve the claims to
        # be excluded wholesale. The script scans every TRACKED file, checks paths too,
        # separates product from authorship, and requires a written reason for each
        # exception in tools/separation.allow.
        run: python tools/check_separation.py
      - name: PMIDs resolve to the paper we cited
        # Covers code, JSON registers and prose in docs/. Docs were the blind
        # spot that mattered: four of the twelve wrong ids found on 2026-09-07
        # were on docs/metabolic-constants.md, where nothing read them.
        #
        # Offline against the committed cache, so this is deterministic and needs
        # no egress. It fails on a cache miss: a citation added without being
        # resolved is exactly the defect the gate exists to catch, and an unrun
        # check is not a pass. Add one with `python3 tools/check_pmids.py --strict`
        # and commit the refreshed tools/pmid_cache.json.
        # Exceptions live in tools/pmid_docs.allow, one written reason each.
        run: python tools/check_pmids.py --offline --strict
      - name: Every shipped number names its source
        # check_pmids proves a citation resolves; this proves the *numbers* have
        # one. Seven constants in dig/ were bare literals emitted in to_dict()
        # payloads with nothing attached. Reads the same pmid cache, so the two
        # gates cannot drift apart.
        run: python tools/check_constants.py --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests --exclude tests/_legacy_test_pathways_source.py
      - name: Binding resolver (no dangling x-binding_site)
        # Every x-binding_site in the host-state schemas and the genome seed
        # registry must resolve to a parameter introspected from the live
        # engine. A binding annotation that cannot be checked is decoration.
        run: python tools/resolve_bindings.py
      - name: Pytest (full suite)
        # Was four hand-picked files; the rest of tests/ was green but unguarded,
        # so regressions in it could land unnoticed.
        run: pytest tests/ -q
      - name: Pathway packs (script form)
        run: PYTHONPATH=src python tests/test_pathway_packs.py
      - name: Pathway integration gate
        # CONTRIBUTING.md has said "must exit 0 before merge" since the pathway
        # template landed, but nothing ran it here — a contributor could follow
        # the guide, skip the step, and still see green.
        run: PYTHONPATH=src python scripts/check_pathway_integration.py
      - name: Build wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Wheel size guard
        run: |
          WHL=$(ls dist/*.whl)
          BYTES=$(wc -c < "$WHL")
          echo "wheel bytes=$BYTES"
          # fail if wheel > 2.5 MiB (bulk snapshots should stay out)
          test "$BYTES" -lt 2621440
      - name: Wheel import smoke
        run: |
          pip install dist/*.whl --force-reinstall
          python - <<'PY'
          import tomllib
          from biology_as_code import simulate_meal, __version__
          from biology_as_code.data.fixtures import list_meal_ids
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          # agreement, not a pinned number: a hardcoded version fails every release
          assert __version__ == declared, (__version__, declared)
          r = simulate_meal(carbs_g=30, protein_g=15, fats_g=10, fiber_g=8)
          assert r.absorbed_macros_g
          assert list_meal_ids()
          PY

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      - name: Pytest with coverage
        run: pytest tests/ -q --cov=biology_as_code --cov-report=term-missing --cov-report=xml
      - name: Coverage floor for audit + packets
        # These two packages are the fail-closed core; they carry a hard floor so
        # an unexercised branch cannot silently become a default pass.
        run: |
          pytest tests/test_claim_audit.py tests/test_packets.py -q \
            --cov=biology_as_code.audit \
            --cov=biology_as_code.packets \
            --cov-report=term-missing \
            --cov-fail-under=90
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml