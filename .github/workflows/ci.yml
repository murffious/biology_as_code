name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  separation:
    name: Separation gate (no product identifiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rule E. The separation gate keeps product IP out; this keeps PEOPLE out.
      # Both are unrecoverable once pushed, so both run before anything expensive.
      - name: No human rows in a public repository
        run: python tools/check_no_human_rows.py
      - name: No product identifiers in src/ or tests/
        # This repository is the open commons: the specification and its
        # reference implementation. No product name may appear in the shipped
        # package or its tests. Root-level IP documents are deliberately out of
        # scope -- their patent disposition is a pending legal decision and they
        # are annotated, not rewritten. See design/BASELINE.md.
        run: |
          if grep -rniE --exclude-dir="*.egg-info" --exclude-dir=__pycache__ "kibo|mealcoach|morf" src/ tests/; then
            echo "::error::product identifier found in src/ or tests/ (see PROPRIETARY_IP.md)"
            exit 1
          fi
          echo "OK: no product identifiers in src/ or tests/"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests --exclude tests/_legacy_test_pathways_source.py
      - name: Binding resolver (no dangling x-binding_site)
        # Every x-binding_site in the host-state schemas and the genome seed
        # registry must resolve to a parameter introspected from the live
        # engine. A binding annotation that cannot be checked is decoration.
        run: python tools/resolve_bindings.py
      - name: Pytest (full suite)
        # Was four hand-picked files; the rest of tests/ was green but unguarded,
        # so regressions in it could land unnoticed.
        run: pytest tests/ -q
      - name: Pathway packs (script form)
        run: PYTHONPATH=src python tests/test_pathway_packs.py
      - name: Build wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Wheel size guard
        run: |
          WHL=$(ls dist/*.whl)
          BYTES=$(wc -c < "$WHL")
          echo "wheel bytes=$BYTES"
          # fail if wheel > 2.5 MiB (bulk snapshots should stay out)
          test "$BYTES" -lt 2621440
      - name: Wheel import smoke
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "from biology_as_code import simulate_meal, __version__; from biology_as_code.data.fixtures import list_meal_ids; r=simulate_meal(carbs_g=30,protein_g=15,fats_g=10,fiber_g=8); assert __version__=='0.1.0'; assert r.absorbed_macros_g; assert list_meal_ids()"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      - name: Pytest with coverage
        run: pytest tests/ -q --cov=biology_as_code --cov-report=term-missing --cov-report=xml
      - name: Coverage floor for audit + packets
        # These two packages are the fail-closed core; they carry a hard floor so
        # an unexercised branch cannot silently become a default pass.
        run: |
          pytest tests/test_claim_audit.py tests/test_packets.py -q \
            --cov=biology_as_code.audit \
            --cov=biology_as_code.packets \
            --cov-report=term-missing \
            --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml