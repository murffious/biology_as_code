# OPTIONAL — GitHub Pages for docs/ only.
# Not required for PyPI, CI tests, or the dig package.
#
# Default: does NOT run on push (avoids red X when Pages is not enabled).
# To deploy later:
#   1. Repo Settings → Pages → Source: GitHub Actions
#   2. Actions → Deploy GitHub Pages → Run workflow
#
# Node deprecation warnings on Actions are from GitHub's runner defaults;
# they are unrelated to this package's Python version.

name: Deploy GitHub Pages

on:
  workflow_dispatch:  # manual only — no automatic push deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Do not auto-create site (needs admin token); enable Pages in Settings first.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
