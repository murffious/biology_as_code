# Build and deploy the MkDocs Material site.
#
# Replaces the previous Jekyll remote-theme setup, which uploaded docs/ as raw
# static files. Builds on every push to main and on PRs (build only, no deploy),
# so a broken nav entry or dead internal link fails in review rather than on the
# live site.
#
# One-time setup: Repo Settings -> Pages -> Source: GitHub Actions.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      - name: Notebooks in sync with cookbook source
        run: python scripts/build_notebooks.py --check
      - name: Cookbook code blocks execute
        run: pytest tests/test_cookbook.py -q
      - name: Build site (strict — warnings are errors)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Deploy only from main; PRs build without publishing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
